name: dependency review

# Refuses a pull request that would add a dependency with a known vulnerability, before it can
# be merged. It reads GitHub's dependency graph for the difference between the two branches, so
# it covers the agent's lock, the mock NVR's requirements and the actions used here.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Named as the check that branch protection requires, so renaming it is deliberate.
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
