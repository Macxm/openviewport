version: 2
updates:
  # The agent's runtime lock and its declared ranges.
  - package-ecosystem: "pip"
    directory: "/agent"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    ignore:
      # pydantic pins its core to one exact version, so pydantic-core only ever moves with
      # pydantic, which brings the matching one along. Proposed on its own it cannot install.
      - dependency-name: "pydantic-core"

  # go2rtc and the Python base images, in the Dockerfiles and in docker-compose.yml.
  - package-ecosystem: "docker"
    directories: ["/agent", "/mock-nvr", "/tests", "/"]
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
