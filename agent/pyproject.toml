[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viewport-agent"
version = "0.1.0"
description = "Control plane for an open-source camera viewport (Reolink first)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  # Used directly by media.py for the video relay. uvicorn[standard] happens to pull it
  # in, but relying on another package's extra for an import of our own is a trap.
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["viewport*"]

[tool.setuptools.package-data]
viewport = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
